name: CI

# What runs here, and what does not
# ---------------------------------
# The invariant gate (code/invariants.py) and the test suite (code/tests) simulate the plant on the
# TMYx weather files, which climate.onebuilding.org does not allow us to redistribute, so they are
# not in this repository and cannot run on a hosted runner. Run them locally after downloading the
# files as described in README.md ("Reproducing the results").
#
# This workflow runs the one check that needs only the committed results and the manuscript:
# docs/provenance_check.py recomputes every mapped manuscript value from results/ and compares it
# with the value printed in the manuscript (recorded in the script and in docs/PROVENANCE.md),
# and checks that the printed string still occurs in paper/*.tex where it is attributed
# (Python standard library only; it never writes to results/).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  provenance:
    name: Manuscript values match the result files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check every mapped value (docs/PROVENANCE.md)
        run: python3 docs/provenance_check.py
