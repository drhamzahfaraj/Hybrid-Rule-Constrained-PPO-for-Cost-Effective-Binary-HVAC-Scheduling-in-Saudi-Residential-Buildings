name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-tables:
    name: Verify published tables reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pyyaml pytest
      - name: Run table consistency tests
        run: python -m pytest tests/ -v
      - name: Re-verify reported percentages
        run: python results/load_tables.py

  build-paper:
    name: Compile manuscript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-publishers texlive-science texlive-pictures \
            texlive-fonts-recommended biber
      - name: Build PDF
        run: |
          pdflatex -interaction=nonstopmode main.tex
          bibtex main
          pdflatex -interaction=nonstopmode main.tex
          pdflatex -interaction=nonstopmode main.tex
      - name: Check for undefined references
        run: |
          if grep -q "undefined" main.log; then
            echo "Undefined references found"; grep -i undefined main.log; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript
          path: main.pdf
